name: Test missing required project input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Octopus server
        run: |
          rm -f /tmp/octopus-requests.log
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock-octopus.py" 18083 /tmp/octopus-requests.log > /tmp/mock.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:18083/ready; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:18083/ready || { echo "mock server did not start"; cat /tmp/mock.out; exit 1; }
          : > /tmp/octopus-requests.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          server: http://127.0.0.1:18083
          api_key: API-NOPROJECTKEY
          space: Default
      - name: Assert failure without contacting the server
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: '$RELEASE'"
          echo "--- requests received ---"
          cat /tmp/octopus-requests.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when project is missing"
            exit 1
          fi
          if [ -n "$RELEASE" ]; then
            echo "FAIL: release_number output should be empty"
            exit 1
          fi
          if grep -q '^REQUEST ' /tmp/octopus-requests.log; then
            echo "FAIL: action contacted the server despite missing required project"
            exit 1
          fi
          echo "PASS"
