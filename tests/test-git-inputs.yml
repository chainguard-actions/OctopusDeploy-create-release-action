name: Test git inputs - git_ref and git_commit for version-controlled projects
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          project: "MyVersionControlledProject"
          server: "https://octopus.example.com/"
          api_key: "API-FAKE000000000000000000000000000"
          space: "Default"
          release_number: "3.0.0"
          git_ref: "refs/heads/main"
          git_commit: "abc1234def5678901234567890abcdef12345678"

      - name: Assert action ran and failed gracefully (no real Octopus server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_NUMBER: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: $RELEASE_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_NUMBER" ]; then
              echo "FAIL: action succeeded but release_number output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with release_number='$RELEASE_NUMBER'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Octopus Deploy server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
