name: Test missing server configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: "MyProject"
          # Intentionally omitting server, api_key, and space to test error handling
      - name: Assert action fails gracefully when server is not configured
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when server configuration is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed when server is not configured"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
