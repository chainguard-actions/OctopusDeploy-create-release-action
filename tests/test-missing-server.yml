name: Test missing server fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          OCTOPUS_URL: ""
        with:
          project: MyProject
          api_key: API-TESTKEY
          space: Default
      - name: Assert action failed validation
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server is missing"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: release_number should be empty"
            exit 1
          fi
          echo "PASS"
