name: Test custom_fields input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: "MyProject"
          server: "https://octopus.example.com/"
          api_key: "API-FAKE000000000000000000000000000"
          space: "Default"
          release_number: "1.0.0"
          custom_fields: |
            myField:myValue
            anotherField:anotherValue
      - name: Assert action ran with custom_fields input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: $RELEASE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE" ]; then
              echo "FAIL: action succeeded but release_number output is empty"
              exit 1
            fi
            echo "PASS: got release_number '$RELEASE'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Octopus server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
