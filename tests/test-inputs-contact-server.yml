name: Test explicit server/api_key/space inputs reach the Octopus server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock Octopus server
        run: |
          rm -f /tmp/octopus-requests.log
          nohup python3 "$GITHUB_WORKSPACE/tests/fixtures/mock-octopus.py" 18080 /tmp/octopus-requests.log > /tmp/mock.out 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:18080/ready; then break; fi
            sleep 1
          done
          curl -s -o /dev/null http://127.0.0.1:18080/ready || { echo "mock server did not start"; cat /tmp/mock.out; exit 1; }
          : > /tmp/octopus-requests.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: My Project
          release_number: 1.2.3
          server: http://127.0.0.1:18080
          api_key: API-INPUTTESTKEY123
          space: Default
      - name: Assert action failed against the mock and sent the API key
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: '$RELEASE'"
          echo "--- requests received ---"
          cat /tmp/octopus-requests.log
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure (mock server always returns 500)"
            exit 1
          fi
          if [ -n "$RELEASE" ]; then
            echo "FAIL: release_number output should be empty"
            exit 1
          fi
          if ! grep -q '^REQUEST ' /tmp/octopus-requests.log; then
            echo "FAIL: action never contacted the configured server"
            exit 1
          fi
          if ! grep -qi 'API-INPUTTESTKEY123' /tmp/octopus-requests.log; then
            echo "FAIL: API key from input was not sent to the server"
            exit 1
          fi
          echo "PASS"
