name: Test unreachable server fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          project: MyProject
          server: http://127.0.0.1:1
          api_key: API-TESTKEY
          space: Default
          release_number: 1.2.3
          package_version: 1.0.0
          packages: |
            Step:Pkg:1.0.0
          custom_fields: |
            Key1:Value1
          ignore_existing: "true"
          release_notes: "Test notes"
      - name: Assert action failed on connection
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when the Octopus server is unreachable"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: release_number should be empty"
            exit 1
          fi
          echo "PASS"
