name: Test missing server, api_key and space fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          OCTOPUS_URL: ""
          OCTOPUS_API_KEY: ""
          OCTOPUS_ACCESS_TOKEN: ""
          OCTOPUS_SPACE: ""
        with:
          project: My Project
      - name: Assert action failed with no output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: '$RELEASE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server/api_key/space are missing"
            exit 1
          fi
          if [ -n "$RELEASE" ]; then
            echo "FAIL: release_number output should be empty"
            exit 1
          fi
          echo "PASS"
