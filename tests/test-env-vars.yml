name: Test with environment variables for server credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OCTOPUS_URL: https://octopus.example.com/
      OCTOPUS_API_KEY: API-FAKE-KEY-FOR-TESTING
      OCTOPUS_SPACE: Default
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project: MyVersionControlledProject
          git_ref: refs/heads/main
          git_commit: ""
      - name: Assert action ran and failed gracefully (no real Octopus server)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_NUMBER: ${{ steps.action.outputs.release_number }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_number: $RELEASE_NUMBER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_NUMBER" ]; then
              echo "FAIL: action succeeded but release_number output is empty"
              exit 1
            fi
            echo "PASS: got release_number '$RELEASE_NUMBER'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Octopus Deploy server available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
